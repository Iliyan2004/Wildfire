<style>
  :root {
    --ink: #ffb78a;

    --bg: #000;
    --display: "Archivo", "Helvetica Neue", Arial, sans-serif;

  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--text); overflow: hidden; -webkit-font-smoothing: antialiased; }
  /* CSS-only night forest with a glow, shown if WebGL is unavailable */
  body.no-gl {

      radial-gradient(60% 34% at 50% 78%, rgba(255, 106, 43, .55) 0%, rgba(255, 106, 43, .18) 45%, transparent 100%),

    padding: 0 clamp(16px, 4vw, 48px); font-size: .74rem; letter-spacing: .26em; text-transform: uppercase;

  header.top .left { display: flex; align-items: center; gap: 14px; min-width: 0; }

  }
  header.top .agn-logo img { height: 28px; width: auto; display: block; }
  footer.meta { bottom: 0; height: 52px; border-top: 1px solid rgba(255, 106, 43, .22); background: linear-gradient(0deg, rgba(0, 0, 0, .8), rgba(0, 0, 0, .25)); padding-bottom: env(safe-area-inset-bottom); }
  @media (max-width: 640px) { header.top .tag { display: none; } footer.meta span:first-child { display: none; } footer.meta { justify-content: center; } }
  main {

    padding: clamp(84px, 17vh, 190px) 20px 14vh; text-align: center;
    transition: opacity .7s ease, transform .9s cubic-bezier(.4, 0, .2, 1);
  }
  body.going main, body.going header.top, body.going footer.meta { opacity: 0; }
  body.going main { transform: translateY(-26px) scale(1.03); }
  header.top, footer.meta { transition: opacity .7s ease; }
  h1 {

  }

    font-size: clamp(.78rem, 1.3vw, .98rem); letter-spacing: .28em; text-transform: uppercase; line-height: 2; text-wrap: balance;

    font-family: var(--display); font-weight: 700; font-stretch: 100%; font-size: clamp(.8rem, 1.2vw, .92rem);
    letter-spacing: .24em; text-transform: uppercase; color: #fff; background: rgba(0, 0, 0, .55);
    border: 1px solid var(--ember); border-radius: 2px; transition: background .25s, color .25s, border-color .25s, box-shadow .25s;
    box-shadow: 0 0 26px rgba(255, 106, 43, .18);
  }
  .open svg { width: 1.2em; height: 1.2em; transition: transform .3s cubic-bezier(.2, .8, .2, 1); }
  .open:hover, .open:focus-visible { background: var(--ember); color: #170702; box-shadow: 0 0 40px rgba(255, 106, 43, .55); }
  .open:hover svg, .open:focus-visible svg { transform: translateX(4px); }
  .open:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
  .rise > * { opacity: 0; transform: translateY(18px); animation: rise .9s cubic-bezier(.2, .8, .2, 1) forwards; }
  .rise > :nth-child(1) { animation-delay: .15s; }
  .rise > :nth-child(2) { animation-delay: .4s; }
  .rise > :nth-child(3) { animation-delay: .6s; }
  .rise > :nth-child(4) { animation-delay: .75s; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .flash { position: fixed; inset: 0; z-index: 5; pointer-events: none; opacity: 0; background: #ffcc73; }

  @media (max-height: 520px) { h1 { font-size: clamp(2rem, 8vw, 4.5rem); } .rule { margin: 10px 0 16px; } main { padding-top: 70px; } }

<body>
<canvas id="fire" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>
<div class="flash" id="flash" aria-hidden="true"></div>

<header class="top">
  <div class="left">
    <span class="agn-logo"><img src="/static/agn-logo.png" alt="AI Geo Navigators" width="170" height="80"></span>
    <span class="brand">PAKFIRE</span>
  </div>
  <span class="tag">Wildfire modelling &middot; Pakistan</span>
</header>

<main>
  <div class="rise" style="display:contents">
    <h1>PAKFIRE</h1>
    <p class="full"><b>Pakistan</b> wildfire spread simulation, exposure &amp; response analytics</p>
    <div class="rule" aria-hidden="true"></div>
    <div class="choices">
      <a class="open" id="openInstant" href="/instant" title="Place a fire, pick the weather, see where it spreads in about a second">
        PAKFIRE Instant
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 5l7 7-7 7"/></svg>
      </a>
      <a class="open" id="open" href="/app" title="The full physical fire spread model: terrain, fuel, weather, exposure and evacuation">
        PAKFIRE Physics
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 5l7 7-7 7"/></svg>
      </a>
    </div>
  </div>
</main>
<footer class="meta"><span>Wildfire intelligence for Pakistan</span><span>Research prototype</span></footer>

<script type="module">
// a shared link (#ign=...) goes straight to the application
if (/ign=/.test(location.hash)) { location.replace("/app" + location.search + location.hash); }
else {
  const links = document.querySelectorAll("a.open"), flash = document.getElementById("flash"), canvas = document.getElementById("fire");
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const DURATION = 4800;                                          // ms from the click to the next page
  let scene = null, busy = false;
  const enter = (href) => { try { sessionStorage.setItem("pakfireEnter", "1"); } catch (e) {} location.href = href; };
  links.forEach((link) => link.addEventListener("click", (e) => {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    if (reduce || busy) { if (reduce) try { sessionStorage.setItem("pakfireEnter", "1"); } catch (x) {} return; }
    e.preventDefault(); busy = true; document.body.classList.add("going");
    if (scene) scene.surge(DURATION).then(() => { flash.style.opacity = "1"; enter(link.href); });
    else { flash.style.transition = "opacity .9s ease-in"; flash.style.opacity = "1"; setTimeout(() => enter(link.href), 1000); }
  }));
  function fallback() { document.body.classList.add("no-gl"); canvas.style.display = "none"; }
  try { const m = await import("/static/landing/scene.js"); scene = m.init({ canvas }); window.__pakfireScene = scene; }
  catch (err) { console.warn("landing scene unavailable:", err); fallback(); }
}
</script>
</body>
